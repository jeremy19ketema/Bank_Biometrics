<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Biometric Banking - Fingerprint Scan</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-low": "#f4f2fc",
                        "tertiary-fixed-dim": "#ffb59a",
                        "on-tertiary-fixed-variant": "#802a00",
                        "surface-bright": "#fbf8ff",
                        "secondary-fixed-dim": "#80d5cb",
                        "secondary-container": "#99efe5",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e3e1eb",
                        "inverse-on-surface": "#f1f0fa",
                        "surface-container-high": "#e8e7f1",
                        "primary-fixed-dim": "#b8c4ff",
                        "secondary": "#006a63",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#444653",
                        "on-surface": "#1a1b22",
                        "background": "#fbf8ff",
                        "tertiary-container": "#872d00",
                        "tertiary-fixed": "#ffdbce",
                        "surface-variant": "#e3e1eb",
                        "primary-fixed": "#dde1ff",
                        "outline-variant": "#c4c5d5",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#00504a",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#9cf2e8",
                        "on-tertiary-fixed": "#380d00",
                        "primary": "#00288e",
                        "on-primary-fixed-variant": "#173bab",
                        "on-background": "#1a1b22",
                        "inverse-surface": "#2f3037",
                        "tertiary": "#611e00",
                        "on-secondary-container": "#006f67",
                        "on-primary-fixed": "#001453",
                        "surface-container": "#eeedf7",
                        "outline": "#757684",
                        "inverse-primary": "#b8c4ff",
                        "on-primary-container": "#a8b8ff",
                        "surface-tint": "#3755c3",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#ffa583",
                        "on-tertiary": "#ffffff",
                        "surface": "#fbf8ff",
                        "surface-dim": "#dad9e3",
                        "on-secondary-fixed": "#00201d",
                        "primary-container": "#1e40af"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "container-max": "1440px",
                        "xl": "32px",
                        "gutter": "24px",
                        "base": "8px",
                        "sm": "8px",
                        "md": "16px",
                        "xs": "4px",
                        "3xl": "64px",
                        "lg": "24px",
                        "2xl": "48px"
                    },
                    fontFamily: {
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "display": ["Inter"],
                        "mono": ["JetBrains Mono"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    fontSize: {
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "mono": ["13px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .scan-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes scan-line {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .scanning-line {
            animation: scan-line 3s linear infinite;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-md overflow-hidden relative">
<!-- Ambient Background Elements -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(ellipse_at_top_left,_var(--tw-gradient-stops))] from-primary-container/30 via-transparent to-transparent"></div>
<div class="absolute bottom-0 right-0 w-full h-full bg-[radial-gradient(ellipse_at_bottom_right,_var(--tw-gradient-stops))] from-secondary-container/20 via-transparent to-transparent"></div>
</div>
<!-- Main Scan Interface -->
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0_12px_32px_-12px_rgba(0,0,0,0.1),_0_0_0_1px_rgba(226,232,240,1)] p-xl relative z-10 flex flex-col items-center">
<!-- Header / Context -->
<div class="w-full text-center mb-2xl">
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Biometric Verification</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please place finger on the scanner.</p>
</div>
<!-- Scanner Area -->
<div class="relative w-48 h-48 flex items-center justify-center mb-xl">
<!-- Pulsing Background Rings -->
<div class="absolute inset-0 rounded-full border-2 border-primary-container opacity-20 scan-ring" style="animation-delay: 0s;"></div>
<div class="absolute inset-0 rounded-full border-2 border-primary-container opacity-20 scan-ring" style="animation-delay: 1s;"></div>
<!-- Scanner Base -->
<div class="relative z-10 w-32 h-32 rounded-full bg-surface-container flex items-center justify-center shadow-[inset_0_2px_4px_rgba(0,0,0,0.05)] border border-outline-variant">
<span class="material-symbols-outlined text-[64px] text-primary" style="font-variation-settings: 'FILL' 0;">fingerprint</span>
<!-- Scanning Line overlay -->
<div class="absolute left-0 right-0 h-0.5 bg-secondary shadow-[0_0_8px_2px_rgba(0,106,99,0.5)] scanning-line z-20"></div>
</div>
</div>
<!-- Status & Target Info -->
<div class="w-full bg-surface-container-low rounded-lg p-md border border-outline-variant mb-xl">
<div class="flex items-center justify-between mb-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Status</span>
<div class="flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="font-label-md text-label-md text-secondary font-semibold">Scanner Ready</span>
</div>
</div>
<div class="h-px w-full bg-outline-variant/50 my-sm"></div>
<div class="flex justify-between items-end">
<div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider block mb-xs">Verifying Identity</span>
<span class="font-headline-md text-headline-md text-on-surface block">Eleanor Vance</span>
</div>
<div class="text-right">
<span class="font-mono text-mono text-on-surface-variant bg-surface-variant px-sm py-xs rounded">ID: 489-B2</span>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full flex gap-md">
<button class="flex-1 h-10 border border-outline rounded text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                Cancel
            </button>
<button class="flex-1 h-10 bg-primary text-on-primary rounded font-label-md text-label-md shadow-sm hover:opacity-90 transition-opacity flex items-center justify-center gap-xs focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined text-[18px]">refresh</span>
                Retry Scan
            </button>
</div>
</main>
</body></html>
